<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Visor de fotos" hidden>
  <div class="lb-top"><span id="lb-count"></span><button class="lb-btn" type="button" id="lb-close" aria-label="Cerrar">×</button></div>
  <div class="lb-stage">
    <button class="lb-btn lb-prev" type="button" id="lb-prev" aria-label="Foto anterior">‹</button>
    <img id="lb-img" alt="" draggable="false">
    <div class="lb-shield" aria-hidden="true"></div>
    <button class="lb-btn lb-next" type="button" id="lb-next" aria-label="Foto siguiente">›</button>
  </div>
  <p class="lb-cap" id="lb-cap"></p>
</div>
